vyaw_tf_yaw_controller:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    map_frame: map
    base_frame: base_link

    # 方向相关参数全部使用角度制（目标 yaw 由 A 点与当前位姿计算得到）
    yaw_tolerance_deg: 3.0

    # Pose-a in map frame（请按地图/策略设置）
    a_x: 0.0
    a_y: 0.0
    a_yaw_deg: 0.0

    # 旋转速度约束（绝对值）
    min_abs_vyaw: 0.15
    max_abs_vyaw: 1.0

    # 简单比例控制增益（基于弧度误差）
    k_p: 1.2

    control_frequency: 30.0
