serial_comm_node:
  ros__parameters:
    port: "/dev/ttyACM0"    # 发送与接收共用同一端口
    baudrate: 115200
    send_frequency: 500
    use_sim_time: false

    cmd_vel_topic: "/cmd_vel"
    vw_topic: "/vw"
    scan_mod_type_topic: "/scan_mod_type"

serial_receive_node:
  ros__parameters:
    port: "/dev/ttyACM0"    # 与发送节点共用同一串口
    baudrate: 115200
    use_sim_time: false

    hurt_armor_topic: "/hurt_armor"
    hp_topic: "/hp"
    match_stage_topic: "/match_stage"
    remain_time_topic: "/remain_time"
    remain_17mm_topic: "/remain_17mm"
    robot_color_topic: "/robot_color"
