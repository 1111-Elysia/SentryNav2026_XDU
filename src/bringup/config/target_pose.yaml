mission_control_node:
  ros__parameters:
    match_stage_topic: "/match_stage"
    nav_goal_topic: "/goal_pose"
    publish_interval: 15.0  # 每10秒发布下一个目标点
    
    # 目标点列表：每4个值表示一个目标点 [x, y, z, yaw_deg]
    target_poses: [
      # 目标点1: 位置(2.0, 1.5, 0.0), 偏航 45 度
      2.0, 1.5, 0.0, 45.0,
      
      # 目标点2: 位置(-2.0, 1.5, 0.0), 偏航 -45 度
      -2.0, 1.5, 0.0, -45.0,
      
      # 目标点3: 位置(0.0, -2.0, 0.0), 偏航 180 度
      0.0, -2.0, 0.0, 180.0,
      
      # 目标点4: 位置(2.0, -1.5, 0.0), 偏航 90 度
      2.0, -1.5, 0.0, 90.0
    ]
