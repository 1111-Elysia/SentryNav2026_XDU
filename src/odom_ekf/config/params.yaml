multi_odom_ekf_node:
  ros__parameters:
    odom_topics: ["/lio/odometry", "/Odometry"] 
    publish_topic: "ekf_odom"

    process_noise: 0.02
    #######################################################################
    # ★过程噪声系数（Q）
    #
    # 影响EKF预测阶段的发散速度
    # 数值越大：预测更容易不受约束，但更容易跟随运动轨迹
    # 数值越小：滤波更稳定，但可能变得迟钝
    #
    # 建议经验范围：0.001～0.1
    #######################################################################
    meas_noise: 0.05
    #######################################################################
    # ★测量噪声系数（R）
    #
    # 影响EKF更新阶段融合时对观测的信任程度
    #
    # 数值越大：观测影响越弱
    # 数值越小：观测影响越强
    #
    # 用于动态协方差缩放的基础值
    #
    # 建议范围：0.001～0.2
    #######################################################################

    chi2_threshold: 9.21   # df=2, α=0.01
    #######################################################################
    # ★卡方检验阈值
    #
    # 用于残差验证，筛除漂移严重的传感器输入
    #
    # 数值来源：
    #   χ² 分布阈值 = df(自由度) & α(显著性)
    #   这里自由度为2（x & y）
    #
    # 常见值：
    #   5.99   → α=0.05
    #   9.21   → α=0.01 (推荐)
    #
    # 若残差Mahalanobis距离 > 阈值 → 数据被拒绝
    #######################################################################
