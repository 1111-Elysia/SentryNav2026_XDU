ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2  # [修改] 从 0.1 增加到 0.2，防止因极短的处理延迟导致数据被丢弃
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    debug_out_file: /tmp/robot_localization_debug.txt

    map_frame: map
    odom_frame: odom
    base_link_frame: livox_frame
    world_frame: odom

    publish_tf: true  # [添加] 必须开启，否则不会发布 odom -> livox_frame 变换

    # 预处理后的第一个里程计
    odom0: /odom_processed1
    odom0_config: [true, true, true,        
                   true, true, true,
                   true, true, true,
                   true, true, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # 预处理后的第二个里程计
    odom1: /odom_processed2
    odom1_config: [true, true, true,
                   true, true, true,
                   true, true, true,
                   true, true, true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: false
    odom1_differential: false
    odom1_relative: false

    # IMU 数据
    imu0: /livox/imu
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  true, true, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    use_control: false