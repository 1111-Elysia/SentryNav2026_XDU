# ──────────────────────────────────────────────
#  Elastic-Tracker SIM Nav2 Parameters
#  MPPI Controller + ElasticTracker Planner
# ──────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    goal_updater_topic: "/target_goal"
    default_nav_to_pose_bt_xml: /home/pgd/SentryNav2026_XDU/install/elastic_tracker_sim/share/elastic_tracker_sim/behavior_trees/tracking_bt.xml
    default_nav_through_poses_bt_xml: /home/pgd/SentryNav2026_XDU/install/elastic_tracker_sim/share/elastic_tracker_sim/behavior_trees/tracking_bt.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node

# ──────────────────────────────────────────────
#  Controller Server: MPPI only
# ──────────────────────────────────────────────

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 999.0

    general_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.1

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 80
      model_dt: 0.04
      batch_size: 1500
      vx_std: 0.3
      vy_std: 0.3
      wz_std: 0.2
      vx_max: 2.0
      vy_max: 2.0
      wz_max: 1.5
      vx_min: -2.0
      vy_min: -2.0
      wz_min: -1.5
      ax_max: 3.0
      ay_max: 3.0
      az_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      az_min: -3.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.25
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      reset_period: 0.08

      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "PathFollowCritic", "PathAlignCritic", "ObstaclesCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        threshold_to_consider: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.25
        near_goal_distance: 0.5

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.8
        critical_cost: 253.0
        consider_footprint: false   # robot_radius is used, not polygon footprint
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.8
        offset_from_furthest: 20
        use_path_orientations: false

# ──────────────────────────────────────────────
#  Planner Server: ElasticTracker only
# ──────────────────────────────────────────────

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased", "ElasticTracker"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.05

    ElasticTracker:
      plugin: "elastic_planner::ElasticPlanner"

      # ── 跟踪参数 ───────────────────────────────────
      tracking_dist: 1.0        # 期望跟踪距离 (m)，弹簧平衡位置
      tracking_dur: 3.0         # 预测/规划时域 (s)
      tracking_dt: 0.2          # 预测时间步长 (s)

      # ── 功能开关 ───────────────────────────────────
      use_tracking: true        # 启用目标追踪模式（内部10Hz重规划定时器）
      ekf_enabled: true         # 启用EKF从位置观测估计目标速度
      target_timeout: 1.0       # 目标丢失超时 (s)，超时后原地悬停

      # ── A* 代价感知 ─────────────────────────
      cost_weight: 5.0

      # ── 路径平滑 (SmacPlanner2D Smoother) ──
      minimum_turning_radius: 0.05
      max_planning_time: 4.5
      smoother.tolerance: 1.0e-10
      smoother.max_iterations: 10000
      smoother.w_data: 0.1
      smoother.w_smooth: 0.4
      smoother.do_refinement: true

      # ── 追踪区域约束 ─────────────────────────
      tracking_zone_vertices: [0.0, 0.0, 5.0, 0.0, 7.0, 5.0, 3.0, 5.0, 0.0, 3.0]

      # ── 目标订阅 ───────────────────────────────────
      target_topic: "/detected_target_pose"  # 目标位置话题 (geometry_msgs/PoseStamped)

# ──────────────────────────────────────────────
#  Local Costmap (scan → obstacles)
# ──────────────────────────────────────────────

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      always_send_full_costmap: true
      transform_tolerance: 0.5
      initial_transform_timeout: 30.0
      width: 30
      height: 30
      resolution: 0.05
      robot_radius: 0.15
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.55

# ──────────────────────────────────────────────
#  Global Costmap (static map + scan updates)
# ──────────────────────────────────────────────

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      initial_transform_timeout: 30.0
      resolution: 0.05
      robot_radius: 0.15
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.75

# ──────────────────────────────────────────────
#  Velocity Smoother
# ──────────────────────────────────────────────

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 2.0, 1.5]
    min_velocity: [-2.0, -2.0, -1.5]
    max_accel: [2.5, 2.5, 3.0]
    max_decel: [-2.5, -2.5, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
