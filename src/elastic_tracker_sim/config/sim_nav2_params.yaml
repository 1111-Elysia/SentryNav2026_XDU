      downhill.wz_max: 1.5
      downhill.vx_min: -2.0
      downhill.vy_min: -2.0
      downhill.wz_min: -1.5
      downhill.ax_max: 3.0
      downhill.ay_max: 3.0
      downhill.az_max: 3.0
      downhill.ax_min: -3.0
      downhill.ay_min: -3.0
      downhill.az_min: -3.0
      downhill.iteration_count: 1
      downhill.prune_distance: 1.7
      downhill.transform_tolerance: 0.1
      downhill.temperature: 0.25
      downhill.gamma: 0.015
      downhill.motion_model: "Omni"
      downhill.visualize: false
      downhill.reset_period: 0.08

      downhill.critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                     "PathFollowCritic", "PathAlignCritic", "ObstaclesCritic"]

      downhill.ConstraintCritic.enabled: true
