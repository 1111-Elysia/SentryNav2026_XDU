# ──────────────────────────────────────────────
#  Planner Server: ElasticTracker only
# ──────────────────────────────────────────────

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased", "ElasticTracker"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.05

    ElasticTracker:
      plugin: "elastic_planner::ElasticPlanner"

      # ── 跟踪参数 ───────────────────────────────────
      tracking_dist: 1.0        # 期望跟踪距离 (m)，弹簧平衡位置
      tracking_dur: 3.0         # 预测/规划时域 (s)
      tracking_dt: 0.2          # 预测时间步长 (s)

      # ── 功能开关 ───────────────────────────────────
      use_tracking: true        # 启用目标追踪模式（内部10Hz重规划定时器）
      ekf_enabled: true         # 启用EKF从位置观测估计目标速度
      target_timeout: 1.0       # 目标丢失超时 (s)，超时后原地悬停

      # ── A* 代价感知 ─────────────────────────
      cost_weight: 5.0

      # ── 路径平滑 (SmacPlanner2D Smoother) ──
      minimum_turning_radius: 0.05
      max_planning_time: 4.5
      smoother.tolerance: 1.0e-10
      smoother.max_iterations: 10000
      smoother.w_data: 0.1
      smoother.w_smooth: 0.4
      smoother.do_refinement: true

      # ── 追踪区域约束 ─────────────────────────
      tracking_zone_vertices: [0.0, 0.0, 5.0, 0.0, 7.0, 5.0, 3.0, 5.0, 0.0, 3.0]

      # ── 目标订阅 ───────────────────────────────────
      target_topic: "/detected_target_pose"  # 目标位置话题 (geometry_msgs/PoseStamped)

# ──────────────────────────────────────────────
#  Local Costmap (scan → obstacles)
# ──────────────────────────────────────────────

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      always_send_full_costmap: true
      transform_tolerance: 0.5
      initial_transform_timeout: 30.0
      width: 30
      height: 30
      resolution: 0.05
      robot_radius: 0.15
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.55

# ──────────────────────────────────────────────
#  Global Costmap (static map + scan updates)
# ──────────────────────────────────────────────

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      initial_transform_timeout: 30.0
      resolution: 0.05
      robot_radius: 0.15
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.75

# ──────────────────────────────────────────────
#  Velocity Smoother
# ──────────────────────────────────────────────

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 2.0, 1.5]
    min_velocity: [-2.0, -2.0, -1.5]
    max_accel: [2.5, 2.5, 3.0]
    max_decel: [-2.5, -2.5, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
