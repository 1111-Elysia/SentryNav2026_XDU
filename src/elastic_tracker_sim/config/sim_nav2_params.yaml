      downhill.ObstaclesCritic.enabled: true
      downhill.ObstaclesCritic.cost_power: 1
      downhill.ObstaclesCritic.repulsion_weight: 1.5
      downhill.ObstaclesCritic.critical_weight: 20.0
      downhill.ObstaclesCritic.consider_footprint: false
      downhill.ObstaclesCritic.collision_cost: 10000.0
      downhill.ObstaclesCritic.collision_margin_distance: 0.25
      downhill.ObstaclesCritic.near_goal_distance: 0.5

      downhill.CostCritic.enabled: true
      downhill.CostCritic.cost_power: 1
